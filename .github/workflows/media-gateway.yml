name: media-gateway

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'media-gateway/**'
      - '.github/workflows/media-gateway.yml'
  pull_request:
    paths:
      - 'media-gateway/**'
      - '.github/workflows/media-gateway.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: media-gateway

env:
  MEDIAMTX_VERSION: v1.15.3

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-gateway/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspaces
      - run: npm audit --omit=dev --audit-level=high

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-gateway/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: media-gateway/web
      - run: npm run test:ui -w web
        env:
          CI: 'true'

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-gateway/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download MediaMTX
        run: |
          curl -fsSL -o /tmp/mediamtx.tgz \
            "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          mkdir -p /tmp/mediamtx && tar -xzf /tmp/mediamtx.tgz -C /tmp/mediamtx
      - run: npm ci
      - run: npm run test:e2e -w server
        env:
          MEDIAMTX_BIN: /tmp/mediamtx/mediamtx

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, ui, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/skybell-gateway-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: media-gateway
          file: media-gateway/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
