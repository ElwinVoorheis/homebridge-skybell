# Serves the React app and puts the API and MediaMTX's browser endpoints on one origin,
# so the page works the same directly or behind a reverse proxy.
server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location /api/ {
        proxy_pass http://server:3000;
    }

    # WebRTC signalling (WHEP). Media itself flows over UDP 8189 straight to MediaMTX.
    location /webrtc/ {
        proxy_pass http://mediamtx:8889/;
    }

    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
